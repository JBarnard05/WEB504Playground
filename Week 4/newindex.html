<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Video Player</title>
     <link
    href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    rel="stylesheet"
    integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN"
    crossorigin="anonymous"
    />
    <link rel="stylesheet" href="newindex.css">
    <link rel="stylesheet" href="./css/side.css">
</head>
<body>
    <h1>Custom Video Player</h1>
    <video 
    src="https://www.google.com/url?sa=i&url=https%3A%2F%2Fscreenrant.com%2Fharry-potter-dobby-house-elf-facts%2F&psig=AOvVaw3OvSVS9vh-ucyBRyHbJedd&ust=1754536291608000&source=images&cd=vfe&opi=89978449&ved=0CBEQjRxqFwoTCIi71ZSb9Y4DFQAAAAAdAAAAABAE"
    id="video"
    class="screen"
    poster="../assets/images/poster.png"
    ></video>
    <div class="controls">
        <button class="btn" id="play">
            <i class="fa fa-play fa-2x"></i>
        </button>
        <button class="btn" id="stop">
            <i class="fa fa-stop fa-2x"></i>
        </button>
        <input 
         type="range"
         id="progess"
         class="progress"
         min="0"
         max="100"
         step="0.1"
         value="0" 
         />
        <span class="timestamp" id="timestamp">00:00</span>
    </div>

    <script src="./index.js"></script>
</body>
</html>
