<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="desription" content="Jake Barnard | Stuff i do">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Jake Barnard | Prifile, Skills & Projects</title>

        <!-- SEO: Open graph for berrer social media sharing -->
         <meta property="og:title" content="Jake Barnard | Profile, Skills & Projects">
         <meta property="og:desription" content="Jake Barnard | Stuff i do">
         <meta property="og:image" content="">
         <meta property="og:type" content="website">

         <!-- link to external CSS -->
          <link rel="stylesheet" href="styles.css">
    </head>
    <body> 
        <!-- Main header and Nav -->
      <header class="sticky-header" role="banner">
        <!-- site title with ID and keyboard focus -->
         <h1 id="main-title" tabindex="0">Jake's Profile</h1>
         <nav aria-label="Main Navigation">
            <ul class="nav-list">
                <li><a href="#about" class="nav-link">About</a></li>
                <li><a href="#skills" class="nav-link">Skills</a></li>
                <li><a href="#projects" class="nav-link">Projects</a></li>
                <!-- Target="_blank" opens link in a new tab -->
                 <li><a href="#contact" class="nav-link" target="_blank">Contact</a></li>
            </ul>

         </nav>

      </header>    
      <!-- Main page content -->
       <main id="main">
         <!-- About me section -->
          <section id="about" class="card animated" aria-labelledby="about-heading">
              <h1>Portrait of me:</h1>
             <img src="images/0302984001_alt1.jpg" alt="Portrait of Jake Barnard" class="profile-img">
             <h2 id="about-heading">About me</h2>
             <p>Howzit im Jake, love bbls</p>
             <!-- hobbies as an inline list -->
              <ul class="hobbies">
                  <li>Latinas</li>
                  <li>More Latinas</li>
              </ul>
          </section>

          <!-- Projects section with grid and slide in animation -->
           <section id="projects" class="card grid-container">
            <!-- Heading is visually hidden for screen readers only -->
             <h2 id="projects-heading" class="visually-hidden">Projects</h2>
             <div class="project slide-in-left">
                <h3>latinas</h3>
                <p>BBL project</p>
                 
             </div>

           </section>

           <!-- contact form with accessible labels and required fields -->
            <section id="contact" class="card">
                <h2 id="contact-heading">Contact Me</h2>
                <form autocomplete="on">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>

                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" placeholder="Your Email" required>

                    <button class="button" type="submit">Send</button>
                    <button class="button secondary" type="reset">Reset</button>
                </form>

            </section>

       </main>

       <!-- Page footer with structured data for SEO -->
        <footer role="contentinfo">
            <p>&copy;2025 Jake Barnard</p>
            <script type="application/ld+json">
                
            </script>
        </footer>
    </body>
    
</html>
